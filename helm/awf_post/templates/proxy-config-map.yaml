apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-proxy-cmap
data:
  "static-config.yml": |
    global:
      sendAnonymousUsage: true
    log:
      level: INFO
    accessLog:
      format: json
      fields:
        defaultMode: keep
    providers:
      file:
        filename: /traefik/dynamic-conf.yml
        watch: true
    entryPoints:
      web:
        address: ':5000'

  "dynamic-conf.yml": |
    http:
      routers:
        to-app:
          rule: "PathPrefix(`/`)"
          middlewares:
            - basic-auth
          service: awf
      middlewares:
{{- if .Values.apr_credentials }}
        basic-auth:
          basicAuth:
            users:
              - "{{ .Values.apr_credentials }}"
            removeHeader: true
{{- end }}
      services:
        "awf":
          loadBalancer:
            servers:
              - url: "http://{{ .Values.service_name }}:{{ .Values.server_port }}"
