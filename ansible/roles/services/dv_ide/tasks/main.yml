---
# services/dv_ide/tasks/main.yml

- name: Here services/dv_ide/tasks/main.yml to install secrets
  include_role:
    name: commons
    tasks_from: kapply_from_template
  vars:
    kapp_message: "Install secrets for dev"
    template: "dv_secrets.yaml"

- name: Loads kubeconfig
  ansible.builtin.slurp:
    src: "{{ remote_user_home }}/.kube/config"
  register: kubeconfig
  # TODO: when host configured for it

- name: Loads vdasync ca_cert
  ansible.builtin.slurp:
    src: "{{ remote_user_home }}/.config/.otvl/.secrets/ca_cert"
  register: vda_ca_cert

- name: Loads vdasync client_key
  ansible.builtin.slurp:
    src: "{{ remote_user_home }}/.config/.otvl/.secrets/client_key"
  register: vda_client_key

- name: Loads vdasync client_cert
  ansible.builtin.slurp:
    src: "{{ remote_user_home }}/.config/.otvl/.secrets/client_cert"
  register: vda_client_cert

- name: Loads vdasync plugin_key
  ansible.builtin.slurp:
    src: "{{ remote_user_home }}/.config/.otvl/.secrets/plugin_key"
  register: vda_plugin_key

- name: Loads vdasync plugin_cert
  ansible.builtin.slurp:
    src: "{{ remote_user_home }}/.config/.otvl/.secrets/plugin_cert"
  register: vda_plugin_cert

- name: Loads _exthosts.yaml
  ansible.builtin.slurp:
    src: "{{ remote_user_home }}/.config/.otvl/ext_hosts.yaml"
  register: ext_hosts_b64

- name: Builds ext_hosts from _exthosts.yaml
  set_fact:
    ext_hosts: "{{ ext_hosts_b64.content | b64decode | from_yaml }}"

- name: Builds ext_hosts_aliases_str from ext_hosts
  set_fact:
    ext_hosts_aliases_str: "{{ lookup('ansible.builtin.template', 'ext_hosts_aliases.yaml') }}"

- name: Builds hostAliases from ext_hosts_aliases_str
  set_fact:
    ext_hosts_aliases: "{{ ext_hosts_aliases_str | from_yaml }}"

- name: Loop over dv_ide items for release with helm
  include_tasks: release_dv_item.yml
  loop: "{{ cv.dv_ide_items }}"
  loop_control:
    loop_var: current_item

- name: Loop over dspg items for release with helm
  include_tasks: release_dspg_item.yml
  loop: "{{ cv.dspg_items }}"
  loop_control:
    loop_var: current_item

###